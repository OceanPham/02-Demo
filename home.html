<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>02-Demo — Mục lục trang demo</title>
    <!-- Script nạp trước danh sách file cục bộ (hỗ trợ mở trực tiếp file:/// không bị lỗi CORS) -->
    <script src="site/files.js"></script>
    <style>
      :root {
        --bg: #f6f8fa;
        --surface: #ffffff;
        --ink: #1a2332;
        --muted: #5c6b7a;
        --accent: #0969da;
        --accent-hover: #0550ae;
        --border: #d8dee4;
        --shadow: 0 4px 14px -4px rgba(26, 35, 50, 0.1);
        --shadow-hover: 0 10px 24px -10px rgba(26, 35, 50, 0.2);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        background: var(--bg);
        color: var(--ink);
        font-family:
          system-ui,
          -apple-system,
          "Segoe UI",
          Roboto,
          "Helvetica Neue",
          Arial,
          sans-serif;
        line-height: 1.6;
        -webkit-font-smoothing: antialiased;
      }

      .wrap {
        max-width: 1440px;
        margin: 0 auto;
        padding: 40px 24px 64px;
      }

      header {
        margin-bottom: 24px;
      }

      .eyebrow {
        margin: 0 0 8px;
        font-size: 0.8rem;
        font-weight: 600;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--muted);
      }

      h1 {
        margin: 0 0 10px;
        font-size: clamp(1.75rem, 4vw, 2.25rem);
        font-weight: 700;
        line-height: 1.2;
      }

      .lead {
        margin: 0;
        color: var(--muted);
        font-size: 1.05rem;
        max-width: 65ch;
      }

      .toolbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        margin: 28px 0 20px;
        flex-wrap: wrap;
      }

      .count {
        margin: 0;
        font-size: 0.95rem;
        color: var(--muted);
      }

      .count strong {
        color: var(--ink);
      }

      .search-box {
        position: relative;
        min-width: 260px;
      }

      .search-box input {
        width: 100%;
        padding: 8px 14px;
        font-size: 0.9rem;
        border: 1px solid var(--border);
        border-radius: 8px;
        background: var(--surface);
        color: var(--ink);
        outline: none;
        transition: border-color 0.15s ease, box-shadow 0.15s ease;
      }

      .search-box input:focus {
        border-color: var(--accent);
        box-shadow: 0 0 0 3px rgba(9, 105, 218, 0.15);
      }

      /* Grid 5 cột cho màn hình lớn, giảm dần khi thu nhỏ */
      .demos {
        list-style: none;
        margin: 0;
        padding: 0;
        display: grid;
        grid-template-columns: repeat(5, minmax(0, 1fr));
        gap: 16px;
      }

      .demos > li {
        display: flex;
      }

      .demo-card {
        display: flex;
        flex-direction: column;
        justify-content: center;
        width: 100%;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 16px 18px;
        text-decoration: none;
        color: inherit;
        box-shadow: var(--shadow);
        transition:
          border-color 0.15s ease,
          transform 0.15s ease,
          box-shadow 0.15s ease;
        word-break: break-word;
        overflow-wrap: break-word;
      }

      .demo-card:hover {
        border-color: #b6c0cc;
        transform: translateY(-2px);
        box-shadow: var(--shadow-hover);
      }

      .demo-card:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }

      .demo-title {
        margin: 0;
        font-size: 0.95rem;
        font-weight: 600;
        color: var(--accent);
        line-height: 1.45;
        word-break: break-word;
        overflow-wrap: break-word;
      }

      .demo-card:hover .demo-title {
        color: var(--accent-hover);
      }

      .state-loading,
      .state-empty {
        grid-column: 1 / -1;
        text-align: center;
        padding: 48px 20px;
        color: var(--muted);
        font-size: 0.95rem;
      }

      footer {
        margin-top: 48px;
        padding-top: 20px;
        border-top: 1px solid var(--border);
        font-size: 0.85rem;
        color: var(--muted);
      }

      /* Responsive breakpoints: grid 5 trên màn hình lớn -> 4 -> 3 -> 2 -> 1 */
      @media (max-width: 1280px) {
        .demos {
          grid-template-columns: repeat(4, minmax(0, 1fr));
        }
      }

      @media (max-width: 1024px) {
        .demos {
          grid-template-columns: repeat(3, minmax(0, 1fr));
        }
      }

      @media (max-width: 768px) {
        .demos {
          grid-template-columns: repeat(2, minmax(0, 1fr));
          gap: 12px;
        }

        .wrap {
          padding: 32px 16px 48px;
        }

        .toolbar {
          flex-direction: column;
          align-items: stretch;
        }

        .search-box {
          min-width: 100%;
        }
      }

      @media (max-width: 480px) {
        .demos {
          grid-template-columns: 1fr;
        }

        .demo-card {
          padding: 14px;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .demo-card {
          transition: none;
        }

        .demo-card:hover {
          transform: none;
        }
      }
    </style>
  </head>

  <body>
    <div class="wrap">
      <header>
        <p class="eyebrow">GitHub Pages · 02-Demo</p>
        <h1>Mục lục trang demo</h1>
        <p class="lead">
          Danh sách các trang HTML trong thư mục <code>site/</code>. Tự động cập nhật khi thêm file mới.
        </p>
      </header>

      <div class="toolbar">
        <p class="count">Tổng cộng <strong id="demo-count">0</strong> trang demo</p>
        <div class="search-box">
          <input
            type="search"
            id="search-input"
            placeholder="Tìm kiếm trang demo..."
            autocomplete="off"
          />
        </div>
      </div>

      <!-- Danh sách card sinh hoàn toàn tự động bằng JavaScript -->
      <ul class="demos" id="demo-list">
        <li class="state-loading">Đang tải danh sách trang demo...</li>
      </ul>

      <footer>
        Repo <strong>02-Demo</strong> · Deploy từ branch <code>main</code>, thư mục gốc.
      </footer>
    </div>

    <script>
      const REPO_OWNER = 'OceanPham';
      const REPO_NAME = '02-Demo';
      const TARGET_FOLDERS = ['site', 'sites'];

      // Hàm sắp xếp:
      // - File có số ở đầu thì mặc định xếp lên trước, từ lớn đến nhỏ (số lớn đứng trước)
      // - File không có số ở đầu thì xếp xuống dưới, từ lớn đến nhỏ (Z -> A)
      function sortFiles(list) {
        return [...list].sort((a, b) => {
          const numA = a.match(/^(\d+)/);
          const numB = b.match(/^(\d+)/);

          if (numA && numB) {
            const valA = parseInt(numA[1], 10);
            const valB = parseInt(numB[1], 10);
            if (valB !== valA) return valB - valA;
            return b.localeCompare(a, 'vi', { numeric: true, sensitivity: 'base' });
          }
          if (numA && !numB) return -1;
          if (!numA && numB) return 1;

          return b.localeCompare(a, 'vi', { numeric: true, sensitivity: 'base' });
        });
      }

      function escapeHtml(str) {
        return str
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#039;');
      }

      // Hàm sinh HTML card đúng cấu trúc yêu cầu
      function renderCards(files, folder = 'site') {
        const listEl = document.getElementById('demo-list');
        const countEl = document.getElementById('demo-count');
        if (countEl) countEl.textContent = files.length;
        if (!listEl) return;

        if (files.length === 0) {
          listEl.innerHTML = `<li class="state-empty">Không tìm thấy file nào trong thư mục <code>${folder}/</code>.</li>`;
          return;
        }

        listEl.innerHTML = files
          .map(file => {
            const href = `${folder}/${encodeURI(file)}`;
            return `        <li>
          <a class="demo-card" href="${href}">
            <p class="demo-title">${escapeHtml(file)}</p>
          </a>
        </li>`;
          })
          .join('\n');
      }

      // Tự động lấy danh sách file từ các nguồn linh hoạt
      async function autoDiscoverFiles() {
        let detected = null;

        // 1. Nếu mở qua web server cục bộ (Live Server, http-server, localhost...)
        if (
          window.location.protocol.startsWith('http') &&
          (location.hostname === 'localhost' || location.hostname === '127.0.0.1')
        ) {
          for (const folder of TARGET_FOLDERS) {
            try {
              const res = await fetch(`./${folder}/`, { cache: 'no-cache' });
              if (res.ok) {
                const text = await res.text();
                const doc = new DOMParser().parseFromString(text, 'text/html');
                const links = Array.from(doc.querySelectorAll('a'))
                  .map(a => decodeURIComponent(a.getAttribute('href') || ''))
                  .map(h => h.replace(/^.*[\\/]/, ''))
                  .filter(
                    f =>
                      f.endsWith('.html') &&
                      !f.startsWith('index') &&
                      !f.startsWith('home')
                  );
                if (links.length > 0) {
                  detected = { folder, files: Array.from(new Set(links)) };
                  break;
                }
              }
            } catch (_) {}
          }
        }

        // 2. Gọi GitHub REST API trước khi ở trên web online (GitHub Pages) để luôn lấy danh sách file mới nhất trên nhánh main kể cả khi quên chạy sync.js
        const isLocalhost =
          location.hostname === 'localhost' || location.hostname === '127.0.0.1';

        if (!detected && window.location.protocol.startsWith('http') && !isLocalhost) {
          for (const folder of TARGET_FOLDERS) {
            try {
              const apiUrl = `https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/${folder}?ref=main&_t=${Date.now()}`;
              const res = await fetch(apiUrl, { cache: 'no-store' });
              if (res.ok) {
                const data = await res.json();
                if (Array.isArray(data)) {
                  const files = data
                    .filter(
                      i =>
                        i.type === 'file' &&
                        i.name.endsWith('.html') &&
                        !i.name.startsWith('index') &&
                        !i.name.startsWith('home')
                    )
                    .map(i => i.name);
                  if (files.length > 0) {
                    detected = { folder, files };
                    break;
                  }
                }
              }
            } catch (_) {}
          }
        }

        // 3. Thử tải file manifest cục bộ files.json (dùng cho localhost hoặc gộp bổ sung/fallback khi GitHub API bị giới hạn rate-limit)
        if (window.location.protocol.startsWith('http')) {
          for (const folder of TARGET_FOLDERS) {
            try {
              const res = await fetch(`./${folder}/files.json?_t=${Date.now()}`, { cache: 'no-store' });
              if (res.ok) {
                const list = await res.json();
                if (Array.isArray(list) && list.length > 0) {
                  if (!detected) {
                    detected = { folder, files: list };
                  } else if (detected.folder === folder) {
                    detected.files = Array.from(new Set([...detected.files, ...list]));
                  }
                  break;
                }
              }
            } catch (_) {}
          }
        }

        // 4. Fallback gọi GitHub REST API nếu trên localhost mà chưa tìm thấy file cục bộ
        if (!detected) {
          for (const folder of TARGET_FOLDERS) {
            try {
              const apiUrl = `https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/${folder}?ref=main&_t=${Date.now()}`;
              const res = await fetch(apiUrl, { cache: 'no-store' });
              if (res.ok) {
                const data = await res.json();
                if (Array.isArray(data)) {
                  const files = data
                    .filter(
                      i =>
                        i.type === 'file' &&
                        i.name.endsWith('.html') &&
                        !i.name.startsWith('index') &&
                        !i.name.startsWith('home')
                    )
                    .map(i => i.name);
                  if (files.length > 0) {
                    detected = { folder, files };
                    break;
                  }
                }
              }
            } catch (_) {}
          }
        }

        // 4. Nếu chưa tìm thấy và có window.__INITIAL_SITE_FILES__ (nạp từ site/files.js)
        if (!detected && window.__INITIAL_SITE_FILES__ && Array.isArray(window.__INITIAL_SITE_FILES__)) {
          detected = { folder: 'site', files: window.__INITIAL_SITE_FILES__ };
        }

        // 5. Fallback gọi root GitHub repo (nếu commit trên remote chưa chuyển vào folder site)
        if (!detected) {
          try {
            const apiUrl = `https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents?ref=main&_t=${Date.now()}`;
            const res = await fetch(apiUrl);
            if (res.ok) {
              const data = await res.json();
              if (Array.isArray(data)) {
                const files = data
                  .filter(
                    i =>
                      i.type === 'file' &&
                      i.name.endsWith('.html') &&
                      !i.name.startsWith('index') &&
                      !i.name.startsWith('home')
                  )
                  .map(i => i.name);
                if (files.length > 0) {
                  detected = { folder: 'site', files };
                }
              }
            }
          } catch (_) {}
        }

        if (detected && detected.files && detected.files.length > 0) {
          const sorted = sortFiles(detected.files);
          renderCards(sorted, detected.folder);
        } else {
          const listEl = document.getElementById('demo-list');
          if (listEl) {
            listEl.innerHTML = `<li class="state-empty">Không thể lấy danh sách file. Vui lòng mở trang qua Local Server (Live Server) hoặc kiểm tra thư mục <code>site/</code>.</li>`;
          }
        }
      }

      // Khởi chạy ngay với dữ liệu có sẵn nếu có để hiển thị tức thì
      if (window.__INITIAL_SITE_FILES__ && Array.isArray(window.__INITIAL_SITE_FILES__)) {
        renderCards(sortFiles(window.__INITIAL_SITE_FILES__), 'site');
      }

      // Luôn kiểm tra đồng bộ cập nhật mới nhất
      autoDiscoverFiles();

      // Bộ lọc tìm kiếm nhanh
      const searchInput = document.getElementById('search-input');
      if (searchInput) {
        searchInput.addEventListener('input', (e) => {
          const q = e.target.value.trim().toLowerCase();
          const items = document.querySelectorAll(
            '#demo-list li:not(.state-loading):not(.state-empty)'
          );
          let visibleCount = 0;
          items.forEach(li => {
            const title = li.querySelector('.demo-title')?.textContent?.toLowerCase() || '';
            const match = !q || title.includes(q);
            li.style.display = match ? '' : 'none';
            if (match) visibleCount++;
          });
          const countEl = document.getElementById('demo-count');
          if (countEl) countEl.textContent = visibleCount;
        });
      }
    </script>
  </body>
</html>
