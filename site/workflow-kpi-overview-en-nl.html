  <script type="application/json" id="kpi-data">[{"id":1,"en":{"title":"Agreed Sales Value / Sales value / Budget €","current":"These show the commercial amount agreed with the client, normally calculated from Work Packages.","proposal":"Use one agreed sales-value definition and label, with historical estimates identified separately."},"nl":{"title":"Overeengekomen verkoopwaarde / Verkoopwaarde / Budget €","current":"Deze tonen het commerciële bedrag dat met de klant is afgesproken, doorgaans berekend op basis van werkpakketten.","proposal":"Eén definitie en benaming voor de overeengekomen verkoopwaarde gebruiken en historische schattingen afzonderlijk aanduiden."}},{"id":2,"en":{"title":"Internal Cost Budget","current":"This is the planned cost ceiling, entered separately from sales value.","proposal":"Retain it for cost control and never use it as a substitute for missing sales value."},"nl":{"title":"Intern kostenbudget","current":"Dit is de geplande kostengrens, die los van de verkoopwaarde wordt ingevoerd.","proposal":"Dit behouden voor kostenbeheersing en nooit gebruiken als vervanging voor een ontbrekende verkoopwaarde."}},{"id":3,"en":{"title":"Budget hours / WP hours / Task budget / Logtime limit","current":"These represent allowances at different levels. They currently come from project settings, Work Packages or task estimates.","proposal":"Identify the level explicitly and distinguish planned hours from warning thresholds and enforced limits."},"nl":{"title":"Budgeturen / Werkpakketuren / Taakbudget / Urenregistratielimiet","current":"Deze geven urenbudgetten op verschillende niveaus weer. Ze zijn momenteel afkomstig uit projectinstellingen, werkpakketten of taakschattingen.","proposal":"Het niveau expliciet benoemen en geplande uren onderscheiden van waarschuwingsdrempels en afgedwongen limieten."}},{"id":4,"en":{"title":"Budget progress","current":"This estimates money used as logged hours × (sales value ÷ project budget hours). It does not measure actual cost.","proposal":"Remove it from the standard Projects overview; use Hours used for time consumption and Financials for cost and margin."},"nl":{"title":"Budgetvoortgang","current":"Dit schat het verbruikte bedrag als geregistreerde uren × (verkoopwaarde ÷ gebudgetteerde projecturen). Het meet geen werkelijke kosten.","proposal":"Dit verwijderen uit het standaardprojectoverzicht; Verbruikte uren gebruiken voor tijdsbesteding en Financiën voor kosten en marge."}},{"id":5,"en":{"title":"Logged hours / Approved / Pending / Time logged","current":"These show recorded work, but their filters differ. Projects generally includes Approved + Pending; Tasks shows Approved billable hours; Attendance totals show Approved hours.","proposal":"Give these three meanings distinct names and use each consistently."},"nl":{"title":"Geregistreerde uren / Goedgekeurd / In afwachting / Bestede tijd","current":"Deze tonen geregistreerd werk, maar de filters verschillen. Projecten telt doorgaans Goedgekeurd + In afwachting; Taken toont goedgekeurde factureerbare uren; de totalen bij Aanwezigheid tonen goedgekeurde uren.","proposal":"Deze drie betekenissen verschillende namen geven en elke betekenis consequent toepassen."}},{"id":6,"en":{"title":"Billable / Internal / Non-billable / Billable ratio","current":"These classify recorded hours. The percentage is billable hours ÷ total hours.","proposal":"Agree one treatment for entries without a billability setting and keep this ratio separate from financial revenue."},"nl":{"title":"Factureerbaar / Intern / Niet-factureerbaar / Aandeel factureerbare uren","current":"Deze delen geregistreerde uren in. Het percentage is factureerbare uren ÷ totale uren.","proposal":"Eén werkwijze afspreken voor registraties waarbij niet is ingesteld of ze factureerbaar zijn, en dit aandeel gescheiden houden van financiële omzet."}},{"id":7,"en":{"title":"Time progress / Logtime usage / Remaining / Over limit","current":"These compare consumed hours with an allowance.","proposal":"Show Hours used, Hours remaining and Hours over, using the same consumption rule wherever the same allowance is shown."},"nl":{"title":"Tijdsvoortgang / Verbruik van urenbudget / Resterend / Limietoverschrijding","current":"Deze vergelijken verbruikte uren met een urenbudget.","proposal":"Verbruikte uren, Resterende uren en Uren boven budget tonen, met dezelfde verbruiksregel overal waar hetzelfde urenbudget wordt getoond."}},{"id":8,"en":{"title":"Remaining work / Expected total / Total forecast / Budget minus forecast","current":"These estimate the final hours required. Task Forecast prefers the assignee’s remaining estimate; Overview currently derives remaining work from task/checklist estimates.","proposal":"Use one remaining-work forecast, identify fallbacks and show incomplete forecasts clearly."},"nl":{"title":"Resterend werk / Verwacht totaal / Totale prognose / Budget minus prognose","current":"Deze schatten het uiteindelijke aantal benodigde uren. De taakprognose gebruikt bij voorkeur de inschatting van het resterende werk door de toegewezen medewerker; het overzicht leidt het resterende werk momenteel af uit taak- en controlelijstschattingen.","proposal":"Eén prognose voor resterend werk gebruiken, alternatieve berekeningsbronnen benoemen en onvolledige prognoses duidelijk aangeven."}},{"id":9,"en":{"title":"Task Progress / Group Progress / Work complete","current":"These measure completion. Tasks use checklist or recorded progress; groups average tasks; Work Package completion can be weighted by estimated hours.","proposal":"Agree the completion method at each level and disclose whether it is task-weighted or hours-weighted."},"nl":{"title":"Taakvoortgang / Groepsvoortgang / Voltooiing van het werk","current":"Deze meten de voltooiing. Taken gebruiken voortgang uit de controlelijst of vastgelegde voortgang; groepen nemen het gemiddelde van de taken; de voltooiing van werkpakketten kan naar geschatte uren worden gewogen.","proposal":"Per niveau één voltooiingsmethode afspreken en vermelden of taken of uren als weging worden gebruikt."}},{"id":10,"en":{"title":"Workflow progress / Project stage / Operational status / Billing status / Payment","current":"These describe different lifecycle positions.","proposal":"Keep work status, billing readiness and payment position separate, and remove overlapping legacy stage fields only after their replacements cover the existing workflow."},"nl":{"title":"Voortgang werkproces / Projectfase / Operationele status / Factureringsstatus / Betaling","current":"Deze beschrijven verschillende posities binnen de levenscyclus.","proposal":"Werkstatus, gereedheid voor facturatie en betalingspositie gescheiden houden. Overlappende oude fasevelden pas verwijderen wanneer hun vervangers het bestaande werkproces volledig ondersteunen."}},{"id":11,"en":{"title":"Teams PROGRESS / BURN","current":"These currently estimate progress from fixed status percentages, then multiply that percentage by budget hours.","proposal":"Replace them with authoritative work completion and actual logged hours; remove the estimates if reliable figures are unavailable."},"nl":{"title":"Teams VOORTGANG / VERBRUIK","current":"Deze schatten de voortgang momenteel op basis van vaste percentages per status en vermenigvuldigen dat percentage vervolgens met de budgeturen.","proposal":"Deze vervangen door de vastgestelde werkvoortgang en werkelijk geregistreerde uren; de schattingen verwijderen als betrouwbare cijfers ontbreken."}},{"id":12,"en":{"title":"Total invoiced / Total sent / Revenue","current":"These show issued invoice value, but Invoice Reports includes VAT while Financials and margin analysis exclude VAT.","proposal":"Distinguish Invoice value including VAT from Revenue excluding VAT and align draft, cancellation and credit rules within each measure."},"nl":{"title":"Totaal gefactureerd / Totaal verzonden / Omzet","current":"Deze tonen de waarde van uitgereikte facturen, maar factuurrapporten zijn inclusief btw, terwijl Financiën en margeanalyses exclusief btw rekenen.","proposal":"Factuurwaarde inclusief btw onderscheiden van Omzet exclusief btw en de regels voor concepten, annuleringen en crediteringen per maatstaf gelijktrekken."}},{"id":13,"en":{"title":"Paid / Collected (YTD)","current":"Paid invoice value and cash collected are different measures. Some cards follow invoice dates; collections follow payment dates and can include partial settlements.","proposal":"Retain both with explicit date and VAT bases."},"nl":{"title":"Betaald / Geïnd (jaar tot nu toe)","current":"Betaalde factuurwaarde en ontvangen betalingen zijn verschillende maatstaven. Sommige kaarten gebruiken factuurdatums; ontvangsten volgen betaaldata en kunnen deelbetalingen bevatten.","proposal":"Beide behouden en bij beide expliciet vermelden welke datum en btw-basis worden gebruikt."}},{"id":14,"en":{"title":"Outstanding / Receivables / Overdue / Due today / Later this week","current":"These support collections. Some views sum full invoice values; others deduct recorded payments.","proposal":"Use remaining gross balances for collection actions, retain clearly labelled net financial analysis and keep the due-date buckets."},"nl":{"title":"Openstaand / Te ontvangen / Achterstallig / Vandaag vervallend / Later deze week","current":"Deze ondersteunen het innen van betalingen. Sommige weergaven tellen volledige factuurwaarden op; andere trekken geregistreerde betalingen ervan af.","proposal":"Voor betalingsopvolging openstaande saldi inclusief btw gebruiken, financiële analyses exclusief btw duidelijk blijven benoemen en de indeling op vervaldatum behouden."}},{"id":15,"en":{"title":"Invoices to create / To invoice / Drafts / Selection status","current":"These describe different preparation stages: ready projects, eligible unbilled hours, draft invoice values and selection completeness.","proposal":"Keep them separate and never present selection completion as invoice issuance or payment completion."},"nl":{"title":"Aan te maken facturen / Te factureren / Concepten / Selectiestatus","current":"Deze beschrijven verschillende voorbereidingsfasen: projecten die gereed zijn, in aanmerking komende nog niet gefactureerde uren, waarden van conceptfacturen en de volledigheid van een selectie.","proposal":"Deze gescheiden houden en een volledige selectie nooit presenteren als volledig uitgereikte of betaalde facturen."}},{"id":16,"en":{"title":"Recorded labour cost / Invoice Margin / Margin % / Revenue per hour / Margin per hour","current":"These analyse invoiced work using net revenue and linked labour.","proposal":"Label them as labour-margin measures, use consistent recorded rates and show unavailable results when rates or allocations are missing."},"nl":{"title":"Geregistreerde personeelskosten / Factuurmarge / Marge % / Omzet per uur / Marge per uur","current":"Deze analyseren gefactureerd werk op basis van omzet exclusief btw en de eraan gekoppelde arbeidsuren.","proposal":"Deze benoemen als maatstaven voor de marge na personeelskosten, consequent dezelfde vastgelegde kosttarieven gebruiken en resultaten als niet beschikbaar tonen wanneer tarieven of toerekeningen ontbreken."}},{"id":17,"en":{"title":"Project Costs / Forecast margin","current":"The main Costs card includes recorded costs plus Pending labour, remaining work and confirmed future expenses/subscriptions.","proposal":"Call it Forecast cost at completion and show Recorded costs separately."},"nl":{"title":"Projectkosten / Verwachte marge","current":"De hoofdkaart Kosten omvat geregistreerde kosten plus personeelskosten voor uren in afwachting van goedkeuring, resterend werk en bevestigde toekomstige uitgaven en abonnementskosten.","proposal":"Deze Verwachte kosten bij afronding noemen en Geregistreerde kosten afzonderlijk tonen."}},{"id":18,"en":{"title":"Target margin / Forecast / Difference / Value at risk","current":"These flag commercial pressure. The Home forecast currently estimates future cost from remaining budget hours and the booked average rate.","proposal":"Retain one risk panel, align its forecast with Financials and identify the forecasting method."},"nl":{"title":"Doelmarge / Prognose / Verschil / Risicobedrag","current":"Deze signaleren commerciële druk. De prognose op de startpagina schat toekomstige kosten momenteel op basis van resterende budgeturen en het gemiddelde kosttarief van de geregistreerde uren.","proposal":"Eén risicopaneel behouden, de prognose laten aansluiten op Financiën en de gebruikte prognosemethode vermelden."}},{"id":19,"en":{"title":"Open quotation value / Accepted / Total pipeline / Win rate","current":"These monitor quotations. Open value counts Sent quotations; Win rate compares accepted with accepted-plus-declined outcomes; Total pipeline currently also includes concluded quotations.","proposal":"Separate Open pipeline from All quotation value and keep quotations separate from invoiced revenue."},"nl":{"title":"Openstaande offertewaarde / Geaccepteerd / Totale pijplijn / Winpercentage","current":"Deze indicatoren volgen offertes. De openstaande waarde omvat verzonden offertes; het winpercentage vergelijkt geaccepteerde offertes met het totaal van geaccepteerde en afgewezen offertes. De totale pijplijn omvat momenteel ook afgesloten offertes.","proposal":"Maak onderscheid tussen de openstaande pijplijn en de totale offertewaarde, en houd offertes gescheiden van gefactureerde omzet."}},{"id":20,"en":{"title":"Work Report Sales value / Invoiced / Still to invoice / Margin","current":"These explain selected work against its commercial position. Sales value can represent the full order, while Invoiced covers sent invoices across all dates.","proposal":"Clearly distinguish full-order, all-dates and selected-period figures, and state the basis of each margin."},"nl":{"title":"Werkrapport: verkoopwaarde / Gefactureerd / Nog te factureren / Marge","current":"Deze indicatoren plaatsen het geselecteerde werk in zijn commerciële context. De verkoopwaarde kan de volledige opdracht omvatten, terwijl Gefactureerd de verzonden facturen over alle datums omvat.","proposal":"Maak duidelijk onderscheid tussen cijfers voor de volledige opdracht, cijfers over alle datums en cijfers voor de geselecteerde periode. Vermeld de grondslag van elke marge."}},{"id":21,"en":{"title":"Client Account Margin / Active Value","current":"These combine invoiced work with optional remaining active-order value.","proposal":"Show invoiced revenue and unbilled order value separately, count labour once and avoid presenting labour margin as complete project profitability."},"nl":{"title":"Klantmarge / Waarde van actieve opdrachten","current":"Deze indicatoren combineren gefactureerd werk met desgewenst de resterende waarde van actieve opdrachten.","proposal":"Toon gefactureerde omzet en nog niet gefactureerde opdrachtwaarde afzonderlijk, tel arbeidskosten slechts eenmaal mee en presenteer de marge na arbeidskosten niet als de volledige winstgevendheid van een project."}},{"id":22,"en":{"title":"On-time / Average cycle","current":"These currently rely on stored project dates; missing dates can count as on time.","proposal":"Use reliable actual delivery dates, show missing information as unknown and distinguish planned duration from actual completion time."},"nl":{"title":"Op tijd / Gemiddelde doorlooptijd","current":"Deze indicatoren zijn momenteel gebaseerd op opgeslagen projectdatums; ontbrekende datums kunnen daarbij als op tijd worden meegeteld.","proposal":"Gebruik betrouwbare werkelijke opleverdatums, toon ontbrekende gegevens als onbekend en maak onderscheid tussen de geplande duur en de werkelijke tijd tot afronding."}},{"id":23,"en":{"title":"Active / Total / Running / Invoice / Financial / Client and Team counts","current":"These show portfolio size and workload. “Active” currently excludes different stages in different views.","proposal":"Agree the lifecycle definitions and label deliberate differences in scope."},"nl":{"title":"Actief / Totaal / Lopend / Facturatie / Financieel / Aantallen klanten en teams","current":"Deze indicatoren tonen de omvang van de portefeuille en de werkbelasting. Actief sluit momenteel in verschillende weergaven verschillende fasen uit.","proposal":"Spreek de definities van de levenscyclusfasen af en vermeld bewuste verschillen in het gegevensbereik."}},{"id":24,"en":{"title":"Capacity / Target / Load / Utilization","current":"These currently compare different things: recorded hours against staff capacity, hours against project budgets, or future work against available capacity.","proposal":"Name them Recorded capacity use, Project hours used and Forecast workload respectively."},"nl":{"title":"Capaciteit / Normuren / Belasting / Benutting","current":"Deze indicatoren vergelijken momenteel verschillende zaken: geregistreerde uren met personeelscapaciteit, uren met projectbudgetten, of toekomstig werk met beschikbare capaciteit.","proposal":"Noem deze indicatoren respectievelijk Geregistreerd capaciteitsgebruik, Verbruikte projecturen en Verwachte werkbelasting."}},{"id":25,"en":{"title":"Calendar planned hours / Scheduled / Estimated hours / Actual hours","current":"These describe planning and execution. Shared plans can count person-hours, while actuals use recorded work.","proposal":"Distinguish person-hours, elapsed time, estimates and actuals, with the selected period visible."},"nl":{"title":"Geplande kalenderuren / Ingepland / Geraamde uren / Werkelijke uren","current":"Deze indicatoren beschrijven planning en uitvoering. Gedeelde planningen kunnen persoonsuren tellen, terwijl werkelijke uren uit geregistreerd werk komen.","proposal":"Maak onderscheid tussen persoonsuren, verstreken tijd, ramingen en werkelijke uren, en toon de geselecteerde periode."}},{"id":26,"en":{"title":"Team Board capacity / Leave impact","current":"These compare remaining work with future availability and identify work affected by leave.","proposal":"Retain them, agree the capacity/holiday rules, identify pending leave as a scenario and disclose missing estimates or owner-only allocations."},"nl":{"title":"Capaciteit op het teambord / Gevolgen van verlof","current":"Deze indicatoren vergelijken het resterende werk met de toekomstige beschikbaarheid en maken duidelijk welk werk door verlof wordt geraakt.","proposal":"Behoud ze, spreek de regels voor capaciteit en feestdagen af, geef nog niet goedgekeurd verlof als scenario weer en vermeld ontbrekende ramingen of toerekening uitsluitend aan de taakverantwoordelijke."}},{"id":27,"en":{"title":"Delivery report / Task planning","current":"Projects, Tasks updated, Not updated, Need attention, Missing information, Overdue work and Next 2 weeks support follow-up.","proposal":"Retain the different views but make their reporting window and overdue rules consistent and explicit."},"nl":{"title":"Opleverrapport / Taakplanning","current":"Projecten, Bijgewerkte taken, Niet bijgewerkt, Aandacht nodig, Ontbrekende gegevens, Achterstallig werk en Komende twee weken ondersteunen de opvolging.","proposal":"Behoud de verschillende weergaven, maar maak hun rapportageperiode en regels voor achterstallig werk onderling consistent en expliciet."}},{"id":28,"en":{"title":"Tracking Age / Heat / At risk / Workload status / Actions logged","current":"These are attention signals based on inactivity, overdue work and responsibility.","proposal":"Disclose their thresholds and scope; rename the limited action count Recent actions so it does not imply a complete history."},"nl":{"title":"Tracking: inactiviteitsduur / Urgentieniveau / Risico / Werkbelasting / Geregistreerde acties","current":"Dit zijn aandachtssignalen op basis van inactiviteit, achterstallig werk en verantwoordelijkheid.","proposal":"Vermeld de drempels en het gegevensbereik. Hernoem het beperkte aantal acties naar Recente acties, zodat het niet de indruk van een volledige historie wekt."}},{"id":29,"en":{"title":"Logtime Report / Pre-invoice Hours / Work Report totals","current":"These summarize different selections. Pre-invoice focuses on uninvoiced time; Work Report uses selected or invoice-linked entries.","proposal":"Retain their distinct purposes and make visible date, member and billability filters govern the corresponding summaries."},"nl":{"title":"Urenrapport / Nog te factureren uren / Totalen van het werkrapport","current":"Deze rapporten vatten verschillende selecties samen. Nog te factureren uren richt zich op niet-gefactureerde tijd; het werkrapport gebruikt geselecteerde of aan facturen gekoppelde registraties.","proposal":"Behoud hun afzonderlijke doelen en laat de zichtbare filters voor datum, medewerker en factureerbaarheid de bijbehorende totalen bepalen."}},{"id":30,"en":{"title":"Subtask Done / Est vs actual / Efficiency","current":"These compare checklist completion and consumed estimates. Efficiency currently means actual hours ÷ estimated hours.","proposal":"Rename that ratio Estimate used %, keeping checklist completion as a separate measure."},"nl":{"title":"Deeltaken: gereed / Raming versus werkelijk / Efficiëntie","current":"Deze indicatoren vergelijken de voltooiing van controlelijsten met het verbruik van geraamde uren. Efficiëntie betekent momenteel werkelijke uren ÷ geraamde uren.","proposal":"Hernoem deze verhouding naar Verbruik ten opzichte van de raming (%), en behoud de voltooiing van controlelijsten als afzonderlijke maatstaf."}},{"id":31,"en":{"title":"Issue Report Open / Verification / Closed / MTTR","current":"These track the issue queue and resolution speed. MTTR averages valid opened-to-resolved durations.","proposal":"Retain the stages and duration measure, with the reporting cohort and missing-date treatment stated."},"nl":{"title":"Problemenrapport: open / Ter verificatie / Gesloten / Gemiddelde oplostijd (MTTR)","current":"Deze indicatoren volgen de werkvoorraad van problemen en de snelheid waarmee ze worden opgelost. MTTR is het gemiddelde van geldige tijdsduren tussen openen en oplossen.","proposal":"Behoud de fasen en de tijdsduurmeting, en vermeld welke meldingen binnen de rapportage vallen en hoe ontbrekende datums worden behandeld."}},{"id":32,"en":{"title":"Email Inbound / Pending triage / Auto-match / Time-to-route / New project / Conversion rate","current":"These monitor intake and routing. Conversion currently includes links to existing projects; Pending triage is a current backlog.","proposal":"Distinguish New-project conversion from Project routing rate and separate backlog from period activity."},"nl":{"title":"E-mail: inkomend / Nog te beoordelen / Automatische koppeling / Tijd tot toewijzing / Nieuw project / Conversiepercentage","current":"Deze indicatoren volgen de binnenkomst en toewijzing van e-mails. Conversie omvat momenteel ook koppelingen aan bestaande projecten; Nog te beoordelen is de actuele werkvoorraad.","proposal":"Maak onderscheid tussen Conversie naar nieuwe projecten en Toewijzing aan projecten (%), en houd de werkvoorraad gescheiden van de activiteit binnen een periode."}},{"id":33,"en":{"title":"Business records / Draft stages / Lead Register counters","current":"These track entered records, reviews, follow-ups and recorded outreach outcomes. Some are browser-local/manual records; others are shared records.","proposal":"Retain actionable counters in Work, detailed breakdowns in Review and identify the data scope and confirmation level."},"nl":{"title":"Zakelijke registraties / Conceptfasen / Tellers in het leadregister","current":"Deze indicatoren volgen ingevoerde registraties, beoordelingen, vervolgacties en vastgelegde resultaten van prospectbenadering. Sommige gegevens worden handmatig of alleen in de browser vastgelegd; andere worden gedeeld opgeslagen.","proposal":"Behoud actiegerichte tellers in Werk en gedetailleerde uitsplitsingen in Beoordeling. Vermeld het gegevensbereik en de mate van bevestiging."}},{"id":34,"en":{"title":"Content Studio / Published posts / Publication confirmed / Measured posts / Impressions / Reactions / Comments / Reposts / Clicks / Engagement","current":"Studio measures current editorial work; Results uses published posts and recorded snapshots. Engagement is interactions ÷ impressions.","proposal":"Keep backlog and period results separate, avoid repeatedly adding cumulative snapshots and show measurement coverage."},"nl":{"title":"Content Studio / Gepubliceerde berichten / Publicatie bevestigd / Gemeten berichten / Weergaven / Reacties / Opmerkingen / Herplaatsingen / Klikken / Betrokkenheid","current":"Content Studio meet het huidige redactionele werk; Resultaten gebruikt gepubliceerde berichten en vastgelegde meetmomenten. Betrokkenheid is interacties ÷ weergaven.","proposal":"Houd de werkvoorraad en de resultaten binnen een periode gescheiden, tel opeenvolgende cumulatieve meetstanden niet steeds opnieuw op en toon welk deel daadwerkelijk is gemeten."}},{"id":35,"en":{"title":"Document Library / Published Updates / Evidence-review counts","current":"These measure library readiness, release evidence and reviewed requests. Their units are blocks, review choices, publish events, tasks, emails or requests.","proposal":"Retain them in their own workspaces, keep those units separate and avoid treating them as financial or staff-performance measures."},"nl":{"title":"Documentbibliotheek / Gepubliceerde updates / Aantallen bij bewijsbeoordeling","current":"Deze indicatoren meten de gereedheid van de bibliotheek, het bewijs van uitgebrachte versies en beoordeelde verzoeken. De eenheden zijn blokken, beoordelingskeuzes, publicatiegebeurtenissen, taken, e-mails of verzoeken.","proposal":"Behoud ze in hun eigen werkruimten, houd deze eenheden gescheiden en behandel ze niet als maatstaven voor financiën of personeelsprestaties."}},{"id":36,"en":{"title":"Legacy and duplicate indicators","current":"Several older cards repeat newer measures with different rules; some definitions are no longer mounted on current screens.","proposal":"Retire duplicates only after the replacement is agreed, keep useful detail in dedicated reports and reduce the standard overview to the measures needed for decisions."},"nl":{"title":"Oudere en dubbele indicatoren","current":"Verschillende oudere kaarten herhalen nieuwere maatstaven met andere regels; sommige definities worden niet meer op de huidige schermen getoond.","proposal":"Verwijder dubbele indicatoren pas nadat overeenstemming over de vervanging is bereikt, behoud nuttige details in aparte rapporten en beperk het standaardoverzicht tot de maatstaven die nodig zijn voor beslissingen."}}]</script>
  <script>
    (() => {
      'use strict';
      const rows = JSON.parse(document.getElementById('kpi-data').textContent);
      const groups = [
        {id:'commercial',from:1,to:4,en:'Commercial setup',nl:'Commerciële uitgangspunten'},
        {id:'hours',from:5,to:11,en:'Hours & completion',nl:'Uren en voortgang'},
        {id:'finance',from:12,to:22,en:'Invoicing & profitability',nl:'Facturatie en rentabiliteit'},
        {id:'planning',from:23,to:30,en:'Workload & planning',nl:'Werkdruk en planning'},
        {id:'business',from:31,to:34,en:'Business & communication',nl:'Bedrijfsvoering en communicatie'},
        {id:'cleanup',from:35,to:36,en:'Governance & cleanup',nl:'Beheer en opschoning'}
      ];
      const ui = {
        en:{brand:'KPI review',title:'KPI overview & proposed actions',intro:'What each indicator does today, how it is calculated and what we propose to keep, clarify or change. Repeated labels are grouped by their business purpose.',status:'For discussion — not yet implemented',topics:'topics',sections:'sections',date:'11 November 2026',contents:'In this overview',noteTitle:'A proposal, not a change',note:'The proposed actions are recommendations for Daniel’s review. They have not been approved or implemented.',current:'Current function & calculation',currentHelp:'What the existing indicators measure and where their definitions differ.',proposal:'Proposed action',proposalHelp:'What we recommend keeping, renaming, aligning, replacing or retiring.',search:'Search a KPI, calculation or proposed action…',searchLabel:'Search the overview',clear:'Clear search',print:'Print / PDF',language:'Document language',matches:(n)=>n===1?'1 topic':n+' topics',noResults:'No matching topics',noHelp:'Try another word or clear the search to see all 36 topics.',footer:'Current behavior and proposed actions are deliberately separated. This overview does not confirm that any proposed change has been implemented.',range:(a,b)=>'Items '+a+'–'+b,readGuide:'How to read this overview',skip:'Skip to the overview'},
        nl:{brand:'KPI-beoordeling',title:'KPI-overzicht en voorgestelde acties',intro:'Wat elke indicator nu doet, hoe deze wordt berekend en wat we willen behouden, verduidelijken of wijzigen. Terugkerende benamingen zijn gegroepeerd op hun bedrijfsfunctie.',status:'Ter bespreking — nog niet uitgevoerd',topics:'onderwerpen',sections:'onderdelen',date:'11 november 2026',contents:'In dit overzicht',noteTitle:'Een voorstel, geen wijziging',note:'De voorgestelde acties zijn aanbevelingen ter beoordeling door Daniel. Ze zijn nog niet goedgekeurd of uitgevoerd.',current:'Huidige functie en berekening',currentHelp:'Wat de bestaande indicatoren meten en waar de definities verschillen.',proposal:'Voorgestelde actie',proposalHelp:'Wat we willen behouden, hernoemen, afstemmen, vervangen of uitfaseren.',search:'Zoek een KPI, berekening of voorgestelde actie…',searchLabel:'Zoek in het overzicht',clear:'Zoekopdracht wissen',print:'Afdrukken / PDF',language:'Documenttaal',matches:(n)=>n===1?'1 onderwerp':n+' onderwerpen',noResults:'Geen onderwerpen gevonden',noHelp:'Gebruik een ander zoekwoord of wis de zoekopdracht om alle 36 onderwerpen te zien.',footer:'De huidige werking en de voorgestelde acties zijn bewust gescheiden. Dit overzicht bevestigt niet dat een voorgestelde wijziging is uitgevoerd.',range:(a,b)=>'Punten '+a+'–'+b,readGuide:'Uitleg bij dit overzicht',skip:'Ga naar het overzicht'}
      };
      let language='en';try{const saved=localStorage.getItem('workflow-kpi-overview-language');if(saved==='nl')language='nl';}catch{}
      const search=document.getElementById('search');
      const text=(id,value)=>{document.getElementById(id).textContent=value;};
      const make=(tag,className,value)=>{const element=document.createElement(tag);if(className)element.className=className;if(value!==undefined)element.textContent=value;return element;};
      function render(){
        const t=ui[language];document.documentElement.lang=language;document.title='WorkFlow · '+t.brand;
        const labels={'brand-context':t.brand,'status':t.status,'page-title':t.title,'intro-copy':t.intro,'topics-label':t.topics,'sections-label':t.sections,'date-label':t.date,'contents-label':t.contents,'side-note-title':t.noteTitle,'side-note-text':t.note,'current-title':t.current,'current-help':t.currentHelp,'proposal-title':t.proposal,'proposal-help':t.proposalHelp,'print-label':t.print,'no-results-title':t.noResults,'no-results-help':t.noHelp,'footer-note':t.footer,'skip-link':t.skip};
        Object.entries(labels).forEach(([id,value])=>text(id,value));
        document.getElementById('language-switch').setAttribute('aria-label',t.language);document.getElementById('sidebar').setAttribute('aria-label',t.contents);document.getElementById('reading-guide').setAttribute('aria-label',t.readGuide);document.getElementById('clear-search').setAttribute('aria-label',t.clear);
        search.placeholder=t.search;search.setAttribute('aria-label',t.searchLabel);
        document.querySelectorAll('[data-lang]').forEach(button=>button.setAttribute('aria-pressed',String(button.dataset.lang===language)));
        const index=document.getElementById('index'),sections=document.getElementById('sections');index.replaceChildren();sections.replaceChildren();
        groups.forEach(group=>{
          const link=make('a','');link.href='#'+group.id;link.dataset.section=group.id;link.append(make('span','',group[language]),make('span','nav-count',String(group.to-group.from+1)));link.addEventListener('click',()=>{if(search.value){search.value='';filter();}document.querySelectorAll('#index a').forEach(a=>a.removeAttribute('aria-current'));link.setAttribute('aria-current','true');});index.append(link);
          const section=make('section','topic-section');section.id=group.id;section.setAttribute('aria-labelledby',group.id+'-heading');
          const heading=make('div','section-heading'),h2=make('h2','',group[language]);h2.id=group.id+'-heading';heading.append(h2,make('span','section-range',t.range(group.from,group.to)));section.append(heading);
          rows.filter(row=>row.id>=group.from&&row.id<=group.to).forEach(row=>{
            const content=row[language],article=make('article','kpi-item');article.id='item-'+row.id;article.dataset.item=String(row.id);article.dataset.search=[row.en.title,row.en.current,row.en.proposal,row.nl.title,row.nl.current,row.nl.proposal].join(' ').toLocaleLowerCase(language);
            const titleRow=make('div','item-heading'),h3=make('h3','',content.title);h3.id='item-'+row.id+'-title';article.setAttribute('aria-labelledby',h3.id);titleRow.append(make('span','item-number',row.id+'.'),h3);
            const comparison=make('div','comparison'),current=make('div','current'),proposal=make('div','proposal');current.append(make('p','field-label',t.current),make('p','item-copy',content.current));proposal.append(make('p','field-label',t.proposal),make('p','item-copy',content.proposal));comparison.append(current,proposal);article.append(titleRow,comparison);section.append(article);
          });sections.append(section);
        });filter();
      }
      function filter(){
        const needle=search.value.trim().toLocaleLowerCase(language);let count=0;
        document.querySelectorAll('.kpi-item').forEach(article=>{article.hidden=Boolean(needle&&!article.dataset.search.includes(needle));if(!article.hidden)count++;});
        document.querySelectorAll('.topic-section').forEach(section=>{section.hidden=!Array.from(section.querySelectorAll('.kpi-item')).some(article=>!article.hidden);});
        text('result-count',ui[language].matches(count));document.getElementById('no-results').hidden=count>0;document.getElementById('clear-search').hidden=!search.value;
      }
      document.querySelectorAll('[data-lang]').forEach(button=>button.addEventListener('click',()=>{language=button.dataset.lang;try{localStorage.setItem('workflow-kpi-overview-language',language);}catch{}render();}));
      search.addEventListener('input',filter);document.getElementById('clear-search').addEventListener('click',()=>{search.value='';filter();search.focus();});document.getElementById('print-btn').addEventListener('click',()=>window.print());render();
    })();
  </script>
</body>
