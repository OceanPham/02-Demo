<!doctype html>

    <title>Review #147 · WorkFlow</title>
    <style>
      :root {
        color-scheme: light;
        --paper: #fff;
        --page: #f5f7fb;

      }
      a {
        color: inherit;

      h2,

      }

      }

      }

        stroke-linejoin: round;
      }

      }

        overflow-wrap: anywhere;
      }

        padding: 26px 18px 18px;

      }

      }

      }

        margin-bottom: 15px;
      }

      }

        margin-bottom: 5px;
      }
      .lead-note p {
        font-size: 13px;
        color: var(--muted);
      }
      .overview-grid {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 280px;
        align-items: start;
        gap: 32px;
      }
      .summary-list {
        list-style: none;

      }

        color: var(--blue);
      }
      .summary-list p {
        font-size: 14px;
      }
      .side-note {
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--paper);
        padding: 20px;
      }
      .owner {
        padding: 15px 0;
        border-bottom: 1px solid var(--line);
      }
      .owner:first-of-type {
        padding-top: 15px;
      }
      .owner:last-of-type {
        border-bottom: 0;
        padding-bottom: 0;
      }
      .owner p {
        font-size: 12px;
        color: var(--muted);
        margin-top: 4px;
      }
      .owner strong {
        font-size: 14px;
      }
      .stat-strip {
        display: flex;
        flex-wrap: wrap;
        gap: 12px 24px;
        padding: 18px 0;
        margin: 21px 0;
        border-top: 1px solid var(--line);
        border-bottom: 1px solid var(--line);
        color: var(--muted);
        font-size: 13px;
      }
      .stat-strip span {
        display: flex;
        align-items: center;
        gap: 7px;
      }
      .stat-strip .icon {
        color: var(--blue);
      }
      .copy-list {
        margin: 0;
        padding-left: 22px;
        display: grid;
        gap: 15px;
      }
      .copy-list li {
        padding-left: 5px;
        max-width: 100%;
      }
      .copy-list li::marker {
        color: var(--muted);
        font-size: 12px;
      }
      .copy-list p {
        margin-top: 5px;
        color: var(--muted);
        font-size: 13px;
      }
      .copy-list.compact p {
        max-width: 90ch;
      }
      .text-list {
        display: grid;
        gap: 15px;
        margin: 0;
        padding-left: 24px;
      }
      .text-list li {
        padding-left: 5px;
      }
      .controls {
        display: flex;
        align-items: end;
        justify-content: space-between;
        gap: 16px;
        flex-wrap: wrap;
        margin-bottom: 14px;
      }
      .search-field {
        display: flex;
        align-items: center;
        position: relative;
        max-width: 440px;
        flex: 1 1 270px;
      }
      .search-field > .icon {
        position: absolute;
        left: 12px;
        color: var(--muted);
        pointer-events: none;
      }
      .search-field input {
        width: 100%;
        height: 40px;
        border: 1px solid #cdd7e4;
        border-radius: 8px;
        background: var(--paper);
        padding: 8px 12px 8px 39px;
        color: var(--ink);
        font-size: 13px;
      }
      .filter-wrap {
        position: relative;
      }
      .filter-popover {
        position: absolute;
        right: 0;
        top: calc(100% + 7px);

        max-height: 370px;
        overflow: auto;
        padding: 5px;

        border: 1px solid var(--line);
        border-radius: 8px;
        box-shadow: 0 8px 24px #1e293b14;

      }
      .filter-popover button {

        width: 100%;
        text-align: left;
        border-radius: 5px;
        background: transparent;
        padding: 9px 10px;
        color: var(--ink);
        font-size: 13px;
      }
      .filter-popover button:hover,
      .filter-popover button[aria-pressed="true"] {
        background: var(--soft);
        color: var(--blue-dark);
      }
      .control-end {
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .result-count {
        color: var(--muted);
        font-size: 12px;
        margin: 10px 0;
      }
      .table-wrap {
        overflow: auto;
        background: var(--paper);
        border: 1px solid var(--line);
        border-radius: 8px;
        max-width: 100%;
      }
      table {

        font-size: 13px;

      th,

      }
      tbody tr:last-child td,
      tbody tr:last-child th {

      }
      tbody tr:hover > td {
        background: #fbfcfe;
      }
      caption {

        padding: 12px 16px;
        color: var(--muted);

        border-bottom: 1px solid var(--line);
      }
      #impact-table {
        min-width: 1000px;
        table-layout: fixed;
      }
      #impact-table th:nth-child(1) {
        width: 22%;
      }
      #impact-table th:nth-child(2) {
        width: 24%;
      }
      #impact-table th:nth-child(3) {
        width: 30%;
      }
      #impact-table th:nth-child(4) {
        width: 24%;
      }
      .row-name {
        display: block;
        font-size: 13px;
        font-weight: 650;
        color: #2d456e;
        line-height: 1.5;
      }
      .row-area {
        font-size: 11px;
        color: var(--muted);
        margin-top: 5px;
      }
      .row-id {
        font-size: 10px;
        color: #6b7f9b;
        margin-bottom: 5px;
      }
      .row-description {
        margin-bottom: 12px;
      }
      .source-details {
        font-size: 12px;
        margin-top: 14px;
        padding-top: 11px;
        border-top: 1px solid var(--line);
      }
      summary {
        cursor: pointer;
        color: var(--blue-dark);
        font-weight: 600;
        line-height: 1.5;
      }
      details dl {
        margin: 11px 0;
      }
      dt {
        font-size: 11px;
        color: var(--muted);
        font-weight: 650;
        margin-top: 11px;
      }
      dd {

      }

      }
      .empty-state {

        color: var(--muted);
      }
      .flow-list {

        gap: 0;
      }
      .flow-list > li {
        counter-increment: workflow;
        display: grid;
        grid-template-columns: 38px minmax(0, 1fr);
        gap: 15px;
        padding: 20px 0;
        border-bottom: 1px solid var(--line);
      }
      .flow-list > li:before {
        content: counter(workflow);
        border: 1px solid #c9d9f3;
        background: var(--soft);
        border-radius: 50%;

        height: 30px;

        place-items: center;

        font-weight: 650;

      .flow-list .responsibility {

      }
      .flow-list p {

        font-size: 13px;
        margin-top: 7px;
      }
      .examples-layout {
        display: grid;
        grid-template-columns: 255px minmax(0, 1fr);
        gap: 24px;
        align-items: start;
      }
      .case-list {

      .case-button {

      .case-button:hover {

        font-weight: 650;
      }

      }

        font-size: 19px;
      }

      }

      }

      }

        font-weight: 600;

      }

        padding-top: 17px;
        color: var(--muted);
        font-size: 12px;
      }

        display: none;
      }

        position: absolute;
        top: -60px;
        left: 290px;

        color: #fff;
        padding: 10px 16px;
        z-index: 80;
      }
      .skip-link:focus {

      }

          padding-left: 50px;
          padding-right: 50px;
        }

          min-width: 1100px;
        }
        table {
          font-size: 14px;
        }
      }

          --sidebar: 238px;
        }
        .main {
          padding: 28px 24px 50px;
        }
        .topbar {
          padding: 14px 24px;
        }
        .overview-grid {
          grid-template-columns: 1fr;

          grid-template-columns: repeat(3, minmax(0, 1fr));

        .side-note > h3 {
          grid-column: 1/-1;
        }
        .owner {
          padding: 0 !important;
          border-bottom: 0;
        }
        .examples-layout {
          grid-template-columns: 220px minmax(0, 1fr);
        }
      }
      @media (max-width: 1000px) {
        .examples-layout {
          grid-template-columns: 1fr;
        }
        .case-list {
          display: grid;
          grid-template-columns: repeat(2, minmax(0, 1fr));
          max-height: 230px;

          white-space: normal;

          width: 36px;
          padding: 8px;
        }

          --sidebar: 264px;
        }

          margin-left: 0;
        }

          transform: translateX(-100%);

          z-index: 50;

        .app[data-menu="open"] .backdrop {
          display: block;
          position: fixed;
          inset: 0;
          background: #172c4c55;
          z-index: 40;
          border: 0;
        }
        .sidebar-close {

          let i = DATA.cases.findIndex((c) => c.id === state.caseId);
          i += button.id === "next-case" ? 1 : -1;
          if (DATA.cases[i]) {
            state.caseId = DATA.cases[i].id;
            updateCase();
          }
        }
        if (button.id === "print") window.print();
      });
      document.addEventListener("input", (event) => {
        if (event.target.id === "search") {
          state.query = event.target.value;
          applyFilters();
        }
      });
      document.addEventListener("keydown", (event) => {
        if (event.key === "Escape") {
          closeFilter();
          if (document.getElementById("app").dataset.menu === "open")
            closeMenu();
        }
        if (
          event.key === "Tab" &&
          document.getElementById("app").dataset.menu === "open"
        ) {
          const items = [
            ...document.getElementById("sidebar").querySelectorAll("button,a"),
          ].filter((el) => el.getClientRects().length);
          const first = items[0],
            last = items[items.length - 1];
          if (event.shiftKey && document.activeElement === first) {
            event.preventDefault();
            last.focus();
          }
          if (!event.shiftKey && document.activeElement === last) {
            event.preventDefault();
            first.focus();
          }
        }
      });
      let printedDetails = [];
      window.addEventListener("beforeprint", () => {
        printedDetails = [...document.querySelectorAll("details")].filter(
          (el) => !el.open,
        );
        printedDetails.forEach((el) => (el.open = true));
      });
      window.addEventListener("afterprint", () => {
        printedDetails.forEach((el) => (el.open = false));
        printedDetails = [];
      });
      render();
    </script>
  </body>
</html>
