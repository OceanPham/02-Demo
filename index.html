<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chào mừng</title>
  <style>
    :root {
      --bg: #e8edf1;
      --ink: #15202b;
      --muted: #4d5c6b;
      --accent: #0f6e56;
      --line: rgba(21, 32, 43, 0.14);
      --glow: rgba(15, 110, 86, 0.22);
      --panel: rgba(255, 255, 255, 0.55);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #12181e;
        --ink: #e7eef4;
        --muted: #9aabba;
        --accent: #3dbe9a;
        --line: rgba(231, 238, 244, 0.16);
        --glow: rgba(61, 190, 154, 0.2);
        --panel: rgba(18, 24, 30, 0.55);
      }
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
    }

    body {
      min-height: 100dvh;
      color: var(--ink);
      background:
        radial-gradient(900px 520px at 12% -10%, var(--glow), transparent 60%),
        radial-gradient(700px 480px at 110% 110%, var(--glow), transparent 55%),
        var(--bg);
      font-family: Bahnschrift, "Segoe UI", "Avenir Next", system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    .stage {
      min-height: 100dvh;
      display: grid;
      grid-template-columns: minmax(0, 1.15fr) minmax(240px, 0.85fr);
      align-items: center;
      gap: 32px;
      max-width: 1120px;
      margin: 0 auto;
      padding: 48px 40px 56px;
    }

    .copy { max-width: 640px; }

    .mark {
      margin: 0 0 18px;
      font-size: 0.95rem;
      font-weight: 600;
      letter-spacing: 0.02em;
      color: var(--accent);
    }

    h1 {
      margin: 0;
      font-size: clamp(2.7rem, 5vw, 4.5rem);
      font-weight: 650;
      line-height: 1.2;
      letter-spacing: -0.04em;
      white-space: nowrap;
    }

    .sub {
      margin: 22px 0 0;
      max-width: 28ch;
      color: var(--muted);
      font-size: 1.125rem;
      line-height: 1.45;
    }

    .ornament {
      position: relative;
      height: min(68dvh, 560px);
      min-height: 320px;
    }

    .ring,
    .disc,
    .bar,
    .tile {
      position: absolute;
    }

    .ring {
      width: min(78%, 420px);
      aspect-ratio: 1;
      right: 4%;
      top: 8%;
      border-radius: 50%;
      border: 1.5px solid var(--line);
    }

    .ring-inner {
      inset: 14%;
      border-style: dashed;
    }

    .disc {
      width: 42%;
      aspect-ratio: 1;
      left: 6%;
      bottom: 10%;
      border-radius: 50%;
      background: var(--accent);
    }

    .tile {
      width: 30%;
      aspect-ratio: 1;
      right: 2%;
      bottom: 12%;
      border-radius: 28px;
      background: color-mix(in srgb, var(--accent) 32%, var(--bg));
      border: 1px solid color-mix(in srgb, var(--accent) 45%, var(--line));
    }

    @media (prefers-reduced-transparency: reduce) {
      .tile {
        background: var(--bg);
        backdrop-filter: none;
      }
    }

    @media (max-width: 760px) {
      .stage {
        grid-template-columns: 1fr;
        align-content: center;
        padding: 36px 22px 40px;
        gap: 28px;
      }

      .copy { max-width: none; }

      h1 {
        font-size: clamp(2.15rem, 9.5vw, 3.1rem);
        white-space: normal;
        max-width: 12ch;
      }

      .ornament {
        height: 220px;
        min-height: 0;
        order: -1;
      }
    }

    @media (prefers-reduced-motion: no-preference) {
      .copy {
        animation: rise 0.8s cubic-bezier(0.16, 1, 0.3, 1) both;
      }

      .ring {
        animation: drift 14s ease-in-out infinite alternate;
      }

      .disc {
        animation: drift 11s ease-in-out infinite alternate-reverse;
      }
    }

    @keyframes rise {
      from { opacity: 0; transform: translateY(16px); }
      to { opacity: 1; transform: none; }
    }

    @keyframes drift {
      from { transform: translateY(0); }
      to { transform: translateY(-14px); }
    }
  </style>
</head>
<body>
  <main class="stage">
    <div class="copy">
      <p class="mark">02-Demo</p>
      <h1 id="greet">Chào mừng</h1>
      <p class="sub">Bạn vừa mở trang này. Ở lại một lát cũng được.</p>
    </div>
    <div class="ornament" aria-hidden="true">
      <span class="ring"></span>
      <span class="ring ring-inner"></span>
      <span class="disc"></span>
      <span class="tile"></span>
    </div>
  </main>
  <script>
    (function () {
      var hour = new Date().getHours();
      var text = "Chào buổi tối";
      if (hour < 12) text = "Chào buổi sáng";
      else if (hour < 18) text = "Chào buổi chiều";
      document.getElementById("greet").textContent = text;
    })();
  </script>
</body>
</html>
